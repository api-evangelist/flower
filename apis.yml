aid: flower
name: Flower
description: >-
  Flower Labs builds infrastructure for collaborative, decentralized AI. Its
  flagship open-source project, Flower (the `flwr` framework), is a friendly,
  framework-agnostic federated AI framework that lets organizations train and
  fine-tune machine-learning models on distributed, privacy-sensitive data
  without moving it across organizational boundaries — with support for PyTorch,
  TensorFlow, Hugging Face, scikit-learn, JAX, XGBoost, and more. Flower
  Intelligence extends this to on-device inference (TypeScript/JavaScript,
  Kotlin, and Swift SDKs) that can hand off to a confidential remote-compute
  service when extra capacity is needed. Flower also runs SuperGrid (federated
  AI networks), Flower Hub, and a hosted control plane accessed via the flwr
  CLI. Flower Labs is backed by Felicis, Northzone, and Y Combinator.
